<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aethelgard — Procedural Island</title>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<style>
  :root {
    --panel: #121316;
    --line: #2b2d33;
    --line-soft: #23252a;
    --text: #d8dade;
    --text-dim: #9a9ea6;
    --text-faint: #5c6068;
    --accent: #c8b48a;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b0c0e;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 12px;
  }

  #canvas-container {
    position: fixed;
    inset: 0;
  }
  canvas { display: block; width: 100%; height: 100%; outline: none; }

  /* ---------- Panel ---------- */
  #panel {
    position: fixed;
    top: 16px;
    right: 16px;
    width: 258px;
    max-height: calc(100vh - 32px);
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 14px;
    font-size: 12px;
    z-index: 10;
  }

  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: #2b2d33; border-radius: 3px; }

  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 10px;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--line-soft);
  }
  .panel-head h1 {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #e8e9eb;
  }
  #panel-close {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 3px;
    font-family: inherit;
  }
  #panel-close:hover { color: #e8e9eb; background: var(--line-soft); }

  /* ---------- Sliders ---------- */
  .field { margin-bottom: 11px; }
  .field:last-of-type { margin-bottom: 0; }

  .field-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
    color: var(--text-dim);
  }
  .val {
    color: var(--accent);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 3px;
    background: var(--line);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: #d8dade;
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 11px;
    height: 11px;
    border: none;
    border-radius: 50%;
    background: #d8dade;
    cursor: pointer;
  }

  /* ---------- Sections ---------- */
  .section {
    margin-top: 13px;
    padding-top: 12px;
    border-top: 1px solid var(--line-soft);
  }
  .section-title {
    color: var(--text-faint);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 8px;
  }

  .row { display: flex; gap: 4px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }

  .opt {
    flex: 1;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text-dim);
    padding: 6px 4px;
    font-size: 11px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    transition: background 0.12s, color 0.12s, border-color 0.12s;
  }
  .opt:hover { background: #1a1c20; color: var(--text); }
  .opt.active {
    border-color: #6b6350;
    background: #1c1a14;
    color: #d9c9a2;
  }

  .action {
    width: 100%;
    margin-top: 13px;
    padding: 8px;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text);
    font-size: 11px;
    font-family: inherit;
    letter-spacing: 0.05em;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.12s;
  }
  .action:hover { background: #1a1c20; }
  .action:active { background: #22242a; }

  .hint {
    margin-top: 11px;
    font-size: 10px;
    line-height: 1.6;
    color: var(--text-faint);
  }

  /* ---------- Reopen button ---------- */
  #panel-open {
    position: fixed;
    top: 16px;
    right: 16px;
    padding: 7px 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    font-size: 11px;
    font-family: inherit;
    letter-spacing: 0.05em;
    border-radius: 4px;
    cursor: pointer;
    display: none;
    z-index: 10;
  }
  #panel-open:hover { background: #1a1c20; }

  /* ---------- Loader ---------- */
  #loader {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 45%, #14171c 0%, #0b0c0e 72%);
    transition: opacity 0.75s ease;
  }
  #loader.hidden { opacity: 0; pointer-events: none; }

  .loader-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  .loader-ring {
    width: 26px;
    height: 26px;
    border: 1.5px solid rgba(200, 180, 138, 0.16);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: loader-spin 0.9s linear infinite;
  }
  @keyframes loader-spin { to { transform: rotate(360deg); } }

  .loader-text {
    font-size: 11px;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--text-dim);
    animation: loader-pulse 2.2s ease-in-out infinite;
  }
  @keyframes loader-pulse {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 1; }
  }
</style>
</head>
<body>

<div id="loader">
  <div class="loader-inner">
    <div class="loader-ring"></div>
    <div class="loader-text">World is Loading...</div>
  </div>
</div>

<div id="canvas-container"></div>

<aside id="panel">
  <div class="panel-head">
    <h1>Aethelgard</h1>
    <button id="panel-close" title="Close">×</button>
  </div>

  <div class="field">
    <div class="field-head"><span>Sun elevation</span><span class="val" id="val-sun-elevation">34°</span></div>
    <input id="slider-sun-elevation" type="range" min="3" max="82" step="0.5" value="34">
  </div>

  <div class="field">
    <div class="field-head"><span>Sun azimuth</span><span class="val" id="val-sun-azimuth">145°</span></div>
    <input id="slider-sun-azimuth" type="range" min="0" max="360" step="1" value="145">
  </div>

  <div class="field">
    <div class="field-head"><span>Wave swell</span><span class="val" id="val-waves">1.00×</span></div>
    <input id="slider-waves" type="range" min="0.1" max="2.4" step="0.05" value="1.0">
  </div>

  <div class="field">
    <div class="field-head"><span>Wind</span><span class="val" id="val-wind">1.00×</span></div>
    <input id="slider-wind" type="range" min="0" max="2.5" step="0.05" value="1.0">
  </div>

  <div class="field">
    <div class="field-head"><span>Cloud cover</span><span class="val" id="val-clouds">52%</span></div>
    <input id="slider-clouds" type="range" min="0" max="1" step="0.02" value="0.52">
  </div>

  <div class="section">
    <div class="section-title">Lighting</div>
    <div class="row">
      <button class="opt time-btn" data-time="noon">Noon</button>
      <button class="opt time-btn active" data-time="golden">Golden</button>
      <button class="opt time-btn" data-time="sunset">Dusk</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Camera</div>
    <div class="grid2">
      <button class="opt cam-btn active" data-cam="overview">Panorama</button>
      <button class="opt cam-btn" data-cam="lagoon">Lagoon</button>
      <button class="opt cam-btn" data-cam="peak">Summit</button>
      <button class="opt cam-btn" data-cam="shore">Shoreline</button>
    </div>
  </div>

  <button id="regenerate-btn" class="action">Regenerate island</button>

  <div class="hint">Drag to orbit · Scroll to zoom · Right-drag to pan</div>
</aside>

<button id="panel-open">Settings</button>

<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  // ============================================================================
  // 1. NOISE & TERRAIN GENERATOR
  // ============================================================================
  class IslandNoiseGenerator {
    constructor(seed = 1042) {
      this.setSeed(seed);
    }

    setSeed(seed) {
      this.seed = seed;
      this.offsets = [];
      let s = seed * 16807;
      for (let i = 0; i < 32; i++) {
        s = (s * 16807) % 2147483647;
        const ox = ((s / 2147483647) - 0.5) * 500.0;
        s = (s * 16807) % 2147483647;
        const oz = ((s / 2147483647) - 0.5) * 500.0;
        this.offsets.push({ x: ox, z: oz });
      }
    }

    hash2D(ix, iz) {
      let n = Math.imul(ix, 374761393) + Math.imul(iz, 668265263) + Math.imul(this.seed, 1442695041);
      n = (n ^ (n >>> 13)) * 1274126177;
      return ((n ^ (n >>> 16)) >>> 0) / 4294967295.0;
    }

    fade(t) {
      return t * t * t * (t * (t * 6.0 - 15.0) + 10.0);
    }

    lerp(a, b, t) {
      return a + t * (b - a);
    }

    noise2D(x, z) {
      const ix = Math.floor(x);
      const iz = Math.floor(z);
      const fx = x - ix;
      const fz = z - iz;

      const u = this.fade(fx);
      const v = this.fade(fz);

      const n00 = this.hash2D(ix, iz);
      const n10 = this.hash2D(ix + 1, iz);
      const n01 = this.hash2D(ix, iz + 1);
      const n11 = this.hash2D(ix + 1, iz + 1);

      const nx0 = this.lerp(n00, n10, u);
      const nx1 = this.lerp(n01, n11, u);
      return this.lerp(nx0, nx1, v) * 2.0 - 1.0;
    }

    fbm(x, z, octaves = 6, lacunarity = 2.02, gain = 0.5, offsetIdx = 0) {
      let total = 0.0;
      let amplitude = 0.5;
      let frequency = 1.0;
      let maxVal = 0.0;

      let px = x * frequency + this.offsets[offsetIdx].x;
      let pz = z * frequency + this.offsets[offsetIdx].z;

      for (let i = 0; i < octaves; i++) {
        total += this.noise2D(px, pz) * amplitude;
        maxVal += amplitude;
        amplitude *= gain;

        const rx = (0.8 * px - 0.6 * pz) * lacunarity + this.offsets[offsetIdx + i + 1].x * 0.15;
        const rz = (0.6 * px + 0.8 * pz) * lacunarity + this.offsets[offsetIdx + i + 1].z * 0.15;
        px = rx;
        pz = rz;
      }
      return total / maxVal;
    }

    ridgedFBM(x, z, octaves = 5, lacunarity = 2.1, gain = 0.52, offsetIdx = 8) {
      let total = 0.0;
      let amplitude = 0.5;
      let weight = 1.0;

      let px = x + this.offsets[offsetIdx].x;
      let pz = z + this.offsets[offsetIdx].z;

      for (let i = 0; i < octaves; i++) {
        let n = this.noise2D(px, pz);
        n = 1.0 - Math.abs(n);
        n = n * n;
        n *= weight;
        weight = Math.min(1.0, Math.max(0.0, n * 1.8));

        total += n * amplitude;
        amplitude *= gain;

        const rx = (0.8 * px - 0.6 * pz) * lacunarity;
        const rz = (0.6 * px + 0.8 * pz) * lacunarity;
        px = rx;
        pz = rz;
      }
      return total;
    }

    sampleTerrain(x, z) {
      const scale = 0.0068;
      const sx = x * scale;
      const sz = z * scale;

      const qx = this.fbm(sx, sz, 4, 2.0, 0.5, 0);
      const qz = this.fbm(sx + 5.2, sz + 1.3, 4, 2.0, 0.5, 4);

      const rx = this.fbm(sx + 1.8 * qx + 1.7, sz + 1.8 * qz + 9.2, 4, 2.0, 0.5, 12);
      const rz = this.fbm(sx + 1.8 * qx + 8.3, sz + 1.8 * qz + 2.8, 4, 2.0, 0.5, 16);

      const wx = sx + 0.65 * rx;
      const wz = sz + 0.65 * rz;

      const baseHills = this.fbm(wx, wz, 6, 2.05, 0.48, 20);
      const ridges = this.ridgedFBM(wx * 1.15, wz * 1.15, 5, 2.15, 0.5, 8);

      const distFromCenter = Math.sqrt(x * x + z * z);
      const maxIslandRadius = 215.0;
      const coastWarp = qx * 38.0 + rx * 24.0;

      const angle = Math.atan2(z, x);
      const lagoonIndent = Math.exp(-Math.pow(angle - 0.65, 2.0) * 3.5) * 42.0;

      const effectiveRadius = distFromCenter + coastWarp + lagoonIndent;
      const normDist = effectiveRadius / maxIslandRadius;

      let islandMask = 1.0 - Math.pow(Math.max(0.0, normDist), 2.25);
      islandMask = Math.max(-0.45, islandMask);

      let rawElevation = (baseHills * 0.5 + 0.5) * 28.0 + Math.pow(ridges, 1.55) * 62.0;

      const valleyCarve = 1.0 - 0.28 * Math.exp(-Math.pow(qx * 3.5, 2.0));
      rawElevation *= valleyCarve;

      let height = rawElevation * islandMask - 7.5 * (1.0 - Math.max(0.0, islandMask));

      if (height > -1.5 && height < 4.5) {
        const beachT = (height + 1.5) / 6.0;
        const flattened = -1.5 + (beachT * beachT * (3.0 - 2.0 * beachT)) * 5.2;
        height = this.lerp(height, flattened, 0.55);
      }

      if (distFromCenter > maxIslandRadius * 0.95) {
        const deepT = Math.min(1.0, (distFromCenter - maxIslandRadius * 0.95) / 90.0);
        height = this.lerp(height, -18.0, deepT * deepT);
      }

      const moisture = Math.min(1.0, Math.max(0.0, 0.5 + 0.5 * rz + 0.25 * qx));

      return { height, moisture, ridgeFactor: ridges };
    }

    sampleNormal(x, z, eps = 0.6) {
      const hL = this.sampleTerrain(x - eps, z).height;
      const hR = this.sampleTerrain(x + eps, z).height;
      const hD = this.sampleTerrain(x, z - eps).height;
      const hU = this.sampleTerrain(x, z + eps).height;

      const nx = hL - hR;
      const ny = 2.0 * eps;
      const nz = hD - hU;
      const len = Math.sqrt(nx * nx + ny * ny + nz * nz);
      return { x: nx / len, y: ny / len, z: nz / len };
    }
  }

  // ============================================================================
  // 2. SCENE, RENDERER, LIGHTS, CAMERA
  // ============================================================================
  const container = document.getElementById('canvas-container');

  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.08;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const fogColor = new THREE.Color(0x9dc7df);
  scene.fog = new THREE.FogExp2(fogColor, 0.00115);

  // far plane extended so the infinite ocean reaches the horizon
  const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.5, 12000);
  camera.position.set(175, 78, 205);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.045;
  controls.maxPolarAngle = Math.PI * 0.488;
  controls.minPolarAngle = 0.08;
  controls.minDistance = 18;
  controls.maxDistance = 520;
  controls.target.set(0, 12, 0);

  const sunLight = new THREE.DirectionalLight(0xfff4e0, 3.2);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.width = 2048;
  sunLight.shadow.mapSize.height = 2048;
  sunLight.shadow.camera.near = 10;
  sunLight.shadow.camera.far = 650;
  const shadowBounds = 235;
  sunLight.shadow.camera.left = -shadowBounds;
  sunLight.shadow.camera.right = shadowBounds;
  sunLight.shadow.camera.top = shadowBounds;
  sunLight.shadow.camera.bottom = -shadowBounds;
  sunLight.shadow.bias = -0.0004;
  sunLight.shadow.normalBias = 0.035;
  scene.add(sunLight);

  const hemiLight = new THREE.HemisphereLight(0x87ceeb, 0x3d4c38, 1.15);
  scene.add(hemiLight);

  const globalUniforms = {
    uTime: { value: 0 },
    uSunDirection: { value: new THREE.Vector3(0.5, 0.55, -0.65).normalize() },
    uSunColor: { value: new THREE.Color(0xfff1d6) },
    uSkyHorizonColor: { value: new THREE.Color(0xa6d1e6) },
    uSkyZenithColor: { value: new THREE.Color(0x1e5799) },
    uFogColor: { value: fogColor },
    uFogDensity: { value: 0.00115 },
    uWaveIntensity: { value: 1.0 },
    uWindSpeed: { value: 1.0 },
    uCloudCoverage: { value: 0.52 },
    uHeightMap: { value: null },
    uWorldSize: { value: 640.0 }
  };

  // ============================================================================
  // 3. SKY DOME
  // ============================================================================
  const skyVertexShader = /* glsl */`
    varying vec3 vWorldPosition;
    void main() {
      vec4 worldPosition = modelMatrix * vec4(position, 1.0);
      vWorldPosition = worldPosition.xyz;
      gl_Position = projectionMatrix * viewMatrix * worldPosition;
    }
  `;

  const skyFragmentShader = /* glsl */`
    uniform float uTime;
    uniform vec3 uSunDirection;
    uniform vec3 uSunColor;
    uniform vec3 uSkyHorizonColor;
    uniform vec3 uSkyZenithColor;
    uniform float uCloudCoverage;
    uniform float uWindSpeed;

    varying vec3 vWorldPosition;

    float hash(vec2 p) {
      p = fract(p * vec2(123.34, 456.21));
      p += dot(p, p + 45.32);
      return fract(p.x * p.y);
    }

    float noise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(
        mix(hash(i + vec2(0.0, 0.0)), hash(i + vec2(1.0, 0.0)), u.x),
        mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
        u.y
      );
    }

    const mat2 m2 = mat2(0.8, -0.6, 0.6, 0.8);
    float cloudFBM(vec2 p) {
      float f = 0.0;
      float amp = 0.5;
      for (int i = 0; i < 5; i++) {
        f += amp * noise(p);
        p = m2 * p * 2.03;
        amp *= 0.5;
      }
      return f;
    }

    void main() {
      vec3 dir = normalize(vWorldPosition - cameraPosition);
      float elevation = clamp(dir.y, 0.0, 1.0);

      float horizonPow = pow(1.0 - elevation, 2.6);
      vec3 skyCol = mix(uSkyZenithColor, uSkyHorizonColor, horizonPow);

      float sunDot = max(dot(dir, normalize(uSunDirection)), 0.0);
      float mieScatter = pow(sunDot, 6.0) * 0.45 + pow(sunDot, 48.0) * 0.55;
      skyCol += uSunColor * mieScatter * (0.4 + 0.6 * horizonPow);

      float sunDisk = smoothstep(0.99935, 0.99985, sunDot);
      skyCol += uSunColor * sunDisk * 6.5;

      if (dir.y > 0.015 && uCloudCoverage > 0.01) {
        vec2 cloudUV = dir.xz / (dir.y + 0.14) * 1.45;
        vec2 windOffset = vec2(uTime * 0.018 * uWindSpeed, uTime * 0.009 * uWindSpeed);

        float nBase = cloudFBM(cloudUV + windOffset);
        float nDetail = cloudFBM(cloudUV * 2.7 - windOffset * 1.3);
        float combinedCloud = mix(nBase, nDetail, 0.32);

        float threshold = 1.0 - uCloudCoverage * 0.72;
        float cloudDensity = smoothstep(threshold, threshold + 0.28, combinedCloud);
        cloudDensity *= smoothstep(0.015, 0.18, dir.y);

        vec2 sunStep = normalize(uSunDirection.xz + 0.001) * 0.08;
        float thicknessTowardsSun = cloudFBM(cloudUV + windOffset + sunStep);
        float selfShadow = clamp((combinedCloud - thicknessTowardsSun) * 2.5 + 0.5, 0.0, 1.0);

        vec3 cloudDark = mix(uSkyZenithColor * 0.55, uSkyHorizonColor * 0.75, 0.5);
        vec3 cloudBright = mix(vec3(1.0), uSunColor, 0.35) * 1.15;
        vec3 cloudCol = mix(cloudDark, cloudBright, selfShadow);

        cloudCol += uSunColor * pow(sunDot, 10.0) * (1.0 - cloudDensity * 0.5) * 0.65;

        skyCol = mix(skyCol, cloudCol, cloudDensity * 0.88);
      }

      if (dir.y < 0.0) {
        // Blend gently toward a slightly darker horizon tone so the infinite
        // ocean (which fogs to uFogColor = uSkyHorizonColor) meets the sky
        // without a hard seam.
        float below = clamp(-dir.y * 2.2, 0.0, 1.0);
        skyCol = mix(uSkyHorizonColor, uSkyHorizonColor * 0.86, below * below);
      }

      gl_FragColor = vec4(skyCol, 1.0);
    }
  `;

  const skyGeo = new THREE.SphereGeometry(1400, 64, 32);
  const skyMat = new THREE.ShaderMaterial({
    vertexShader: skyVertexShader,
    fragmentShader: skyFragmentShader,
    uniforms: {
      uTime: globalUniforms.uTime,
      uSunDirection: globalUniforms.uSunDirection,
      uSunColor: globalUniforms.uSunColor,
      uSkyHorizonColor: globalUniforms.uSkyHorizonColor,
      uSkyZenithColor: globalUniforms.uSkyZenithColor,
      uCloudCoverage: globalUniforms.uCloudCoverage,
      uWindSpeed: globalUniforms.uWindSpeed
    },
    side: THREE.BackSide,
    depthWrite: false
  });
  const skyDome = new THREE.Mesh(skyGeo, skyMat);
  scene.add(skyDome);

  // ============================================================================
  // 4. WATER
  // ============================================================================
  const waterVertexShader = /* glsl */`
    uniform float uTime;
    uniform float uWaveIntensity;

    varying vec3 vWorldPos;
    varying vec3 vWaveNormal;
    varying float vWaveCrest;

    vec3 gerstnerWave(vec2 pos, float steepness, float amplitude, float wavelength, vec2 direction, float time, inout vec3 tangent, inout vec3 binormal) {
      float k = 6.28318530718 / wavelength;
      float c = sqrt(9.8 / k);
      vec2 d = normalize(direction);
      float f = k * (dot(d, pos) - c * time);
      float a = amplitude * uWaveIntensity;

      tangent += vec3(
        -d.x * d.x * (steepness * a * k * sin(f)),
        d.x * (a * k * cos(f)),
        -d.x * d.y * (steepness * a * k * sin(f))
      );
      binormal += vec3(
        -d.x * d.y * (steepness * a * k * sin(f)),
        d.y * (a * k * cos(f)),
        -d.y * d.y * (steepness * a * k * sin(f))
      );

      return vec3(
        d.x * (steepness * a * cos(f)),
        a * sin(f),
        d.y * (steepness * a * cos(f))
      );
    }

    void main() {
      vec4 worldPos = modelMatrix * vec4(position, 1.0);
      vec2 xz = worldPos.xz;

      vec3 tangent = vec3(1.0, 0.0, 0.0);
      vec3 binormal = vec3(0.0, 0.0, 1.0);
      vec3 disp = vec3(0.0);

      disp += gerstnerWave(xz, 0.35, 0.34, 28.0, vec2(1.0, 0.35), uTime * 1.05, tangent, binormal);
      disp += gerstnerWave(xz, 0.30, 0.22, 17.0, vec2(0.7, -0.65), uTime * 1.15, tangent, binormal);
      disp += gerstnerWave(xz, 0.25, 0.14, 9.5,  vec2(-0.45, 0.85), uTime * 1.30, tangent, binormal);
      disp += gerstnerWave(xz, 0.22, 0.08, 4.8,  vec2(-0.8, -0.35), uTime * 1.45, tangent, binormal);

      float distAtten = 1.0 - smoothstep(220.0, 650.0, length(xz));
      disp *= distAtten;

      worldPos.xyz += disp;
      vWorldPos = worldPos.xyz;
      vWaveNormal = normalize(cross(binormal, tangent));
      vWaveCrest = clamp(disp.y / (0.65 * max(0.2, uWaveIntensity)), 0.0, 1.0);

      gl_Position = projectionMatrix * viewMatrix * worldPos;
    }
  `;

  const waterFragmentShader = /* glsl */`
    uniform float uTime;
    uniform vec3 uSunDirection;
    uniform vec3 uSunColor;
    uniform vec3 uSkyHorizonColor;
    uniform vec3 uSkyZenithColor;
    uniform vec3 uFogColor;
    uniform float uFogDensity;
    uniform float uWaveIntensity;
    uniform float uWindSpeed;
    uniform sampler2D uHeightMap;
    uniform float uWorldSize;

    varying vec3 vWorldPos;
    varying vec3 vWaveNormal;
    varying float vWaveCrest;

    float hash2(vec2 p) {
      p = fract(p * vec2(234.56, 789.12));
      p += dot(p, p + 34.56);
      return fract(p.x * p.y);
    }

    float noise2(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(
        mix(hash2(i + vec2(0.0, 0.0)), hash2(i + vec2(1.0, 0.0)), u.x),
        mix(hash2(i + vec2(0.0, 1.0)), hash2(i + vec2(1.0, 1.0)), u.x),
        u.y
      );
    }

    const mat2 rotMat = mat2(0.8, -0.6, 0.6, 0.8);
    float fbmWater(vec2 p) {
      float v = 0.0;
      float a = 0.5;
      for (int i = 0; i < 4; i++) {
        v += a * noise2(p);
        p = rotMat * p * 2.07;
        a *= 0.5;
      }
      return v;
    }

    void main() {
      vec3 viewVector = cameraPosition - vWorldPos;
      float viewDist = length(viewVector);
      vec3 V = viewVector / viewDist;
      vec3 L = normalize(uSunDirection);

      vec2 terrainUV = (vWorldPos.xz / uWorldSize) + 0.5;
      float terrainHeight = -18.0;
      if (terrainUV.x >= 0.0 && terrainUV.x <= 1.0 && terrainUV.y >= 0.0 && terrainUV.y <= 1.0) {
        terrainHeight = texture2D(uHeightMap, terrainUV).r;
      }

      float waterDepth = max(0.0, vWorldPos.y - terrainHeight);

      vec2 rippleUV = vWorldPos.xz * 0.42;
      float tFlow = uTime * (0.45 + 0.35 * uWindSpeed);
      float eps = 0.12;
      float h0 = fbmWater(rippleUV + vec2(tFlow, -tFlow * 0.7));
      float hx = fbmWater(rippleUV + vec2(eps, 0.0) + vec2(tFlow, -tFlow * 0.7)) - h0;
      float hz = fbmWater(rippleUV + vec2(0.0, eps) + vec2(tFlow, -tFlow * 0.7)) - h0;

      float h0b = fbmWater(rippleUV * 1.9 - vec2(tFlow * 0.8, tFlow * 0.5));
      hx += (fbmWater((rippleUV + vec2(eps, 0.0)) * 1.9 - vec2(tFlow * 0.8, tFlow * 0.5)) - h0b) * 0.6;
      hz += (fbmWater((rippleUV + vec2(0.0, eps)) * 1.9 - vec2(tFlow * 0.8, tFlow * 0.5)) - h0b) * 0.6;

      float rippleFade = 1.0 - smoothstep(45.0, 280.0, viewDist);
      vec3 rippleNormal = normalize(vec3(-hx * 1.85 * rippleFade, 1.0, -hz * 1.85 * rippleFade));
      vec3 N = normalize(vWaveNormal + rippleNormal * 0.55);

      vec3 shallowTurquoise = vec3(0.08, 0.74, 0.68);
      vec3 midEmerald       = vec3(0.02, 0.36, 0.48);
      vec3 deepOceanNavy    = vec3(0.01, 0.08, 0.18);

      float absorbShallow = exp(-waterDepth * 0.34);
      float absorbMid     = exp(-waterDepth * 0.095);
      vec3 waterBaseColor = mix(deepOceanNavy, midEmerald, absorbMid);
      waterBaseColor      = mix(waterBaseColor, shallowTurquoise, absorbShallow);

      float backLight = pow(max(0.0, dot(V, -L + N * 0.45)), 3.0);
      vec3 sssColor = vec3(0.06, 0.82, 0.68) * backLight * (vWaveCrest * 0.85 + absorbShallow * 0.5);
      waterBaseColor += sssColor * uSunColor * 0.55;

      float cosTheta = max(dot(N, V), 0.0);
      float F0 = 0.02;
      float fresnel = F0 + (1.0 - F0) * pow(1.0 - cosTheta, 5.0);
      fresnel = clamp(fresnel, 0.0, 0.92);

      vec3 R = reflect(-V, N);
      float reflElev = clamp(R.y, 0.0, 1.0);
      vec3 skyReflection = mix(uSkyHorizonColor, uSkyZenithColor, pow(reflElev, 0.65));

      vec3 surfaceColor = mix(waterBaseColor, skyReflection, fresnel * 0.78);

      vec3 H = normalize(L + V);
      float NdotH = max(dot(N, H), 0.0);
      float specGlitter = pow(NdotH, 320.0) * 3.8;
      float specBroad   = pow(NdotH, 36.0) * 0.35;
      surfaceColor += uSunColor * (specGlitter + specBroad);

      float foamNoise = fbmWater(vWorldPos.xz * 0.85 + vec2(uTime * 0.25, -uTime * 0.18));

      float shoreEdge = 1.0 - smoothstep(0.0, 0.85, waterDepth);
      float surfWave = sin(waterDepth * 5.2 - uTime * 2.8 + foamNoise * 3.5);
      float surfRings = smoothstep(0.45, 0.95, surfWave) * (1.0 - smoothstep(0.2, 2.6, waterDepth));

      float shoreFoam = clamp(shoreEdge * 1.25 + surfRings * 0.75, 0.0, 1.0);
      shoreFoam = smoothstep(0.32, 0.72, shoreFoam * (0.62 + 0.55 * foamNoise));

      float crestFoam = smoothstep(0.62, 0.95, vWaveCrest * (0.5 + 0.65 * foamNoise)) * smoothstep(1.1, 2.2, uWaveIntensity) * 0.65;

      float totalFoam = clamp(shoreFoam + crestFoam, 0.0, 1.0);
      vec3 foamColor = mix(vec3(0.88, 0.95, 0.98), uSunColor, 0.25);
      surfaceColor = mix(surfaceColor, foamColor, totalFoam);

      float edgeAlpha = smoothstep(0.0, 0.16, waterDepth + totalFoam * 0.15);

      float fogFactor = 1.0 - exp(-uFogDensity * uFogDensity * viewDist * viewDist);
      surfaceColor = mix(surfaceColor, uFogColor, clamp(fogFactor, 0.0, 1.0));

      gl_FragColor = vec4(surfaceColor, edgeAlpha);
    }
  `;

  const waterGeo = new THREE.PlaneGeometry(1600, 1600, 280, 280);
  waterGeo.rotateX(-Math.PI / 2);

  const waterMat = new THREE.ShaderMaterial({
    vertexShader: waterVertexShader,
    fragmentShader: waterFragmentShader,
    uniforms: {
      uTime: globalUniforms.uTime,
      uSunDirection: globalUniforms.uSunDirection,
      uSunColor: globalUniforms.uSunColor,
      uSkyHorizonColor: globalUniforms.uSkyHorizonColor,
      uSkyZenithColor: globalUniforms.uSkyZenithColor,
      uFogColor: globalUniforms.uFogColor,
      uFogDensity: globalUniforms.uFogDensity,
      uWaveIntensity: globalUniforms.uWaveIntensity,
      uWindSpeed: globalUniforms.uWindSpeed,
      uHeightMap: globalUniforms.uHeightMap,
      uWorldSize: globalUniforms.uWorldSize
    },
    transparent: true,
    depthWrite: true
  });

  const waterMesh = new THREE.Mesh(waterGeo, waterMat);
  waterMesh.position.y = 0.0;
  scene.add(waterMesh);

  // ---------------------------------------------------------------------------
  // Far ocean: a huge plane that carries the sea to the horizon.
  // The wave shader attenuates waves to zero beyond ~650 units, so this plane
  // is perfectly flat where it overlaps the near water; it is placed 0.15 units
  // lower to avoid z-fighting, which is imperceptible under fog.
  // ---------------------------------------------------------------------------
  const farWaterGeo = new THREE.PlaneGeometry(30000, 30000, 8, 8);
  farWaterGeo.rotateX(-Math.PI / 2);

  const farWaterMesh = new THREE.Mesh(farWaterGeo, waterMat);
  farWaterMesh.position.y = -0.15;
  farWaterMesh.frustumCulled = false;
  scene.add(farWaterMesh);

  // ============================================================================
  // 5. TERRAIN
  // ============================================================================
  const WORLD_SIZE = 640;
  const TERRAIN_SEGMENTS = 320;
  const noiseGen = new IslandNoiseGenerator(1042);

  let terrainMesh = null;
  let heightDataTexture = null;

  function generateHeightmapDataTexture() {
    const size = 256;
    const data = new Float32Array(size * size * 4);
    for (let j = 0; j < size; j++) {
      const wz = ((j / (size - 1)) - 0.5) * WORLD_SIZE;
      for (let i = 0; i < size; i++) {
        const wx = ((i / (size - 1)) - 0.5) * WORLD_SIZE;
        const { height, moisture } = noiseGen.sampleTerrain(wx, wz);
        const idx = (j * size + i) * 4;
        data[idx] = height;
        data[idx + 1] = moisture;
        data[idx + 2] = 0.0;
        data[idx + 3] = 1.0;
      }
    }
    if (heightDataTexture) heightDataTexture.dispose();
    heightDataTexture = new THREE.DataTexture(data, size, size, THREE.RGBAFormat, THREE.FloatType);
    heightDataTexture.wrapS = THREE.ClampToEdgeWrapping;
    heightDataTexture.wrapT = THREE.ClampToEdgeWrapping;
    heightDataTexture.magFilter = THREE.LinearFilter;
    heightDataTexture.minFilter = THREE.LinearFilter;
    heightDataTexture.needsUpdate = true;
    globalUniforms.uHeightMap.value = heightDataTexture;
  }

  const terrainMaterial = new THREE.MeshStandardMaterial({
    vertexColors: true,
    roughness: 0.86,
    metalness: 0.04
  });

  terrainMaterial.onBeforeCompile = (shader) => {
    shader.uniforms.uTime = globalUniforms.uTime;

    shader.vertexShader = shader.vertexShader.replace(
      '#include <common>',
      /* glsl */`
      #include <common>
      varying vec3 vWorldPos;
      varying vec3 vWorldNormal;
      `
    );

    shader.vertexShader = shader.vertexShader.replace(
      '#include <begin_vertex>',
      /* glsl */`
      #include <begin_vertex>
      vWorldPos = (modelMatrix * vec4(transformed, 1.0)).xyz;
      vWorldNormal = normalize(mat3(modelMatrix) * objectNormal);
      `
    );

    shader.fragmentShader = shader.fragmentShader.replace(
      '#include <common>',
      /* glsl */`
      #include <common>
      varying vec3 vWorldPos;
      varying vec3 vWorldNormal;

      float hashTerrain(vec2 p) {
        p = fract(p * vec2(127.1, 311.7));
        p += dot(p, p + 19.19);
        return fract(p.x * p.y);
      }

      float noiseTerrain(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(
          mix(hashTerrain(i + vec2(0.0, 0.0)), hashTerrain(i + vec2(1.0, 0.0)), u.x),
          mix(hashTerrain(i + vec2(0.0, 1.0)), hashTerrain(i + vec2(1.0, 1.0)), u.x),
          u.y
        );
      }
      `
    );

    shader.fragmentShader = shader.fragmentShader.replace(
      '#include <color_fragment>',
      /* glsl */`
      #include <color_fragment>

      float detail1 = noiseTerrain(vWorldPos.xz * 0.45);
      float detail2 = noiseTerrain(vWorldPos.xz * 2.4);
      float detail3 = noiseTerrain(vWorldPos.xz * 9.5);
      float microDetail = (detail1 * 0.5 + detail2 * 0.35 + detail3 * 0.15) - 0.5;

      float slopeY = clamp(vWorldNormal.y, 0.0, 1.0);
      float cliffFactor = smoothstep(0.76, 0.48, slopeY);

      float strata = sin(vWorldPos.y * 1.65 + detail1 * 4.5) * 0.5 + 0.5;
      vec3 rockStrataCol = mix(vec3(0.24, 0.23, 0.22), vec3(0.46, 0.43, 0.39), strata);

      diffuseColor.rgb = mix(diffuseColor.rgb, rockStrataCol, cliffFactor * 0.65);
      diffuseColor.rgb += microDetail * 0.14;

      float wetness = 1.0 - smoothstep(-0.4, 1.25, vWorldPos.y);
      diffuseColor.rgb = mix(diffuseColor.rgb, diffuseColor.rgb * 0.58, wetness * 0.75);
      `
    );

    shader.fragmentShader = shader.fragmentShader.replace(
      '#include <roughnessmap_fragment>',
      /* glsl */`
      #include <roughnessmap_fragment>
      float shoreWet = 1.0 - smoothstep(-0.2, 1.15, vWorldPos.y);
      float snowPeak = smoothstep(34.0, 44.0, vWorldPos.y) * smoothstep(0.55, 0.8, vWorldNormal.y);
      roughnessFactor = mix(roughnessFactor, 0.18, shoreWet * 0.85);
      roughnessFactor = mix(roughnessFactor, 0.45, snowPeak * 0.6);
      `
    );
  };

  function buildTerrainGeometry() {
    if (terrainMesh) {
      scene.remove(terrainMesh);
      terrainMesh.geometry.dispose();
    }

    const geo = new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE, TERRAIN_SEGMENTS, TERRAIN_SEGMENTS);
    geo.rotateX(-Math.PI / 2);

    const posAttr = geo.attributes.position;
    const vertexCount = posAttr.count;
    const colors = new Float32Array(vertexCount * 3);

    const cDeepSand      = new THREE.Color(0x524738);
    const cWetSand       = new THREE.Color(0x9c8669);
    const cDrySand       = new THREE.Color(0xe6d2aa);
    const cTropicalGrass = new THREE.Color(0x4b7f36);
    const cLushForest    = new THREE.Color(0x285428);
    const cHighlandMoss  = new THREE.Color(0x5a6b3c);
    const cSteepRock     = new THREE.Color(0x524f4b);
    const cDarkSlate     = new THREE.Color(0x363537);
    const cAlpineSnow    = new THREE.Color(0xf2f6fa);
    const tempColor      = new THREE.Color();

    for (let i = 0; i < vertexCount; i++) {
      const vx = posAttr.getX(i);
      const vz = posAttr.getZ(i);
      const { height } = noiseGen.sampleTerrain(vx, vz);
      posAttr.setY(i, height);
    }

    geo.computeVertexNormals();
    const normAttr = geo.attributes.normal;

    for (let i = 0; i < vertexCount; i++) {
      const vx = posAttr.getX(i);
      const vy = posAttr.getY(i);
      const vz = posAttr.getZ(i);
      const ny = normAttr.getY(i);

      const { moisture, ridgeFactor } = noiseGen.sampleTerrain(vx, vz);

      if (vy < -0.3) {
        const t = Math.min(1.0, Math.max(0.0, (vy + 8.0) / 7.7));
        tempColor.copy(cDeepSand).lerp(cWetSand, t);
      } else if (vy < 2.3) {
        const t = Math.min(1.0, (vy + 0.3) / 2.6);
        tempColor.copy(cWetSand).lerp(cDrySand, Math.pow(t, 0.75));
      } else if (vy < 18.0) {
        const beachToGrass = Math.min(1.0, (vy - 2.3) / 2.4);
        const grassCol = cTropicalGrass.clone().lerp(cLushForest, moisture * 0.78);
        tempColor.copy(cDrySand).lerp(grassCol, beachToGrass);
      } else if (vy < 33.0) {
        const t = (vy - 18.0) / 15.0;
        const lowCol = cTropicalGrass.clone().lerp(cLushForest, moisture * 0.65);
        const highCol = cHighlandMoss.clone().lerp(cSteepRock, 0.45);
        tempColor.copy(lowCol).lerp(highCol, t);
      } else {
        const snowBlend = Math.min(1.0, (vy - 33.0) / 9.5);
        tempColor.copy(cSteepRock).lerp(cAlpineSnow, snowBlend);
      }

      const slopeThreshold = vy > 31.0 ? 0.68 : 0.77;
      if (ny < slopeThreshold) {
        const rockBlend = Math.min(1.0, (slopeThreshold - ny) / 0.24);
        const rockTone = cSteepRock.clone().lerp(cDarkSlate, ridgeFactor * 0.55);
        tempColor.lerp(rockTone, rockBlend);
      }

      colors[i * 3]     = tempColor.r;
      colors[i * 3 + 1] = tempColor.g;
      colors[i * 3 + 2] = tempColor.b;
    }

    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    terrainMesh = new THREE.Mesh(geo, terrainMaterial);
    terrainMesh.receiveShadow = true;
    terrainMesh.castShadow = true;
    scene.add(terrainMesh);
  }

  // ============================================================================
  // 6. VEGETATION & ROCKS (INSTANCED)
  // ============================================================================
  function mergeBufferGeometries(geometries) {
    let totalVerts = 0;
    let totalIndices = 0;
    for (const g of geometries) {
      totalVerts += g.attributes.position.count;
      if (g.index) totalIndices += g.index.count;
    }

    const positions = new Float32Array(totalVerts * 3);
    const normals = new Float32Array(totalVerts * 3);
    const colors = new Float32Array(totalVerts * 3);
    const indices = totalIndices > 0 ? new Uint32Array(totalIndices) : null;

    let vOffset = 0;
    let iOffset = 0;

    for (const g of geometries) {
      const pos = g.attributes.position;
      const norm = g.attributes.normal;
      const col = g.attributes.color;
      const count = pos.count;

      for (let i = 0; i < count; i++) {
        positions[(vOffset + i) * 3]     = pos.getX(i);
        positions[(vOffset + i) * 3 + 1] = pos.getY(i);
        positions[(vOffset + i) * 3 + 2] = pos.getZ(i);

        normals[(vOffset + i) * 3]     = norm.getX(i);
        normals[(vOffset + i) * 3 + 1] = norm.getY(i);
        normals[(vOffset + i) * 3 + 2] = norm.getZ(i);

        if (col) {
          colors[(vOffset + i) * 3]     = col.getX(i);
          colors[(vOffset + i) * 3 + 1] = col.getY(i);
          colors[(vOffset + i) * 3 + 2] = col.getZ(i);
        } else {
          colors[(vOffset + i) * 3]     = 1.0;
          colors[(vOffset + i) * 3 + 1] = 1.0;
          colors[(vOffset + i) * 3 + 2] = 1.0;
        }
      }

      if (indices && g.index) {
        const idxAttr = g.index;
        for (let i = 0; i < idxAttr.count; i++) {
          indices[iOffset + i] = idxAttr.getX(i) + vOffset;
        }
        iOffset += idxAttr.count;
      }
      vOffset += count;
    }

    const merged = new THREE.BufferGeometry();
    merged.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    merged.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
    merged.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    if (indices) merged.setIndex(new THREE.BufferAttribute(indices, 1));
    return merged;
  }

  function paintGeometryColors(geo, bottomColor, topColor, minY, maxY) {
    const pos = geo.attributes.position;
    const colors = new Float32Array(pos.count * 3);
    const c = new THREE.Color();
    for (let i = 0; i < pos.count; i++) {
      const y = pos.getY(i);
      const t = Math.min(1.0, Math.max(0.0, (y - minY) / Math.max(0.01, maxY - minY)));
      c.copy(bottomColor).lerp(topColor, t);
      colors[i * 3]     = c.r;
      colors[i * 3 + 1] = c.g;
      colors[i * 3 + 2] = c.b;
    }
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  }

  function injectWindShader(material, swayAmplitude = 0.25, heightScale = 5.0) {
    material.onBeforeCompile = (shader) => {
      shader.uniforms.uTime = globalUniforms.uTime;
      shader.uniforms.uWindSpeed = globalUniforms.uWindSpeed;

      shader.vertexShader = shader.vertexShader.replace(
        '#include <common>',
        /* glsl */`
        #include <common>
        uniform float uTime;
        uniform float uWindSpeed;
        `
      );

      shader.vertexShader = shader.vertexShader.replace(
        '#include <begin_vertex>',
        /* glsl */`
        #include <begin_vertex>
        vec3 instPos = vec3(instanceMatrix[3][0], instanceMatrix[3][1], instanceMatrix[3][2]);
        float heightFactor = clamp(transformed.y / ${heightScale.toFixed(2)}, 0.0, 1.5);
        heightFactor = heightFactor * heightFactor;

        float windPhase = uTime * (1.8 + uWindSpeed * 1.4) + instPos.x * 0.12 + instPos.z * 0.12;
        float swayX = sin(windPhase) * ${swayAmplitude.toFixed(3)} * heightFactor * uWindSpeed;
        float swayZ = cos(windPhase * 0.85) * ${(swayAmplitude * 0.7).toFixed(3)} * heightFactor * uWindSpeed;

        transformed.x += swayX;
        transformed.z += swayZ;
        `
      );
    };
  }

  function createPineGeometries() {
    const trunkGeo = new THREE.CylinderGeometry(0.12, 0.34, 2.2, 7);
    trunkGeo.translate(0, 1.1, 0);
    paintGeometryColors(trunkGeo, new THREE.Color(0x3d281a), new THREE.Color(0x5c3e28), 0, 2.2);

    const tier1 = new THREE.ConeGeometry(1.65, 2.5, 7);
    tier1.translate(0, 2.5, 0);
    paintGeometryColors(tier1, new THREE.Color(0x18381e), new THREE.Color(0x2f5e2e), 1.25, 3.75);

    const tier2 = new THREE.ConeGeometry(1.3, 2.2, 7);
    tier2.translate(0, 3.8, 0);
    paintGeometryColors(tier2, new THREE.Color(0x1e4422), new THREE.Color(0x3b7337), 2.7, 4.9);

    const tier3 = new THREE.ConeGeometry(0.9, 1.8, 7);
    tier3.translate(0, 4.9, 0);
    paintGeometryColors(tier3, new THREE.Color(0x255029), new THREE.Color(0x4c8a42), 4.0, 5.8);

    const canopyGeo = mergeBufferGeometries([tier1, tier2, tier3]);
    return { trunkGeo, canopyGeo };
  }

  function createPalmGeometries() {
    const trunkGeo = new THREE.CylinderGeometry(0.13, 0.28, 4.6, 7, 8);
    trunkGeo.translate(0, 2.3, 0);
    const pos = trunkGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const y = pos.getY(i);
      const normY = y / 4.6;
      pos.setX(i, pos.getX(i) + Math.pow(normY, 1.85) * 0.95);
    }
    trunkGeo.computeVertexNormals();
    paintGeometryColors(trunkGeo, new THREE.Color(0x4f3b2a), new THREE.Color(0x82654c), 0, 4.6);

    const fronds = [];
    const frondCount = 7;
    for (let f = 0; f < frondCount; f++) {
      const angle = (f / frondCount) * Math.PI * 2.0;
      const frond = new THREE.ConeGeometry(0.48, 2.6, 5, 6);
      frond.scale(1.0, 1.0, 0.22);
      frond.rotateZ(-Math.PI * 0.38);
      frond.translate(1.15, 0, 0);

      const fPos = frond.attributes.position;
      for (let k = 0; k < fPos.count; k++) {
        const fx = fPos.getX(k);
        fPos.setY(k, fPos.getY(k) - Math.pow(Math.max(0, fx), 1.9) * 0.26);
      }
      frond.rotateY(angle);
      frond.translate(0.95, 4.5, 0);
      frond.computeVertexNormals();
      paintGeometryColors(frond, new THREE.Color(0x2c6124), new THREE.Color(0x6ca338), 3.6, 5.1);
      fronds.push(frond);
    }

    const crownGeo = mergeBufferGeometries(fronds);
    return { trunkGeo, crownGeo };
  }

  function createBushGeometry() {
    const lobes = [];
    const offsets = [
      { x: 0.0, y: 0.45, z: 0.0, r: 0.65 },
      { x: 0.42, y: 0.35, z: 0.25, r: 0.5 },
      { x: -0.38, y: 0.38, z: 0.2, r: 0.52 },
      { x: 0.05, y: 0.35, z: -0.4, r: 0.48 }
    ];
    for (const o of offsets) {
      const g = new THREE.IcosahedronGeometry(o.r, 1);
      g.scale(1.1, 0.82, 1.1);
      g.translate(o.x, o.y, o.z);
      paintGeometryColors(g, new THREE.Color(0x1f4722), new THREE.Color(0x568c3b), 0.0, 1.0);
      lobes.push(g);
    }
    return mergeBufferGeometries(lobes);
  }

  function createRockGeometry() {
    const geo = new THREE.DodecahedronGeometry(1.0, 1);
    const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const vx = pos.getX(i);
      const vy = pos.getY(i);
      const vz = pos.getZ(i);
      const n = Math.sin(vx * 3.7 + vy * 2.3) * Math.cos(vz * 4.1 - vx * 1.9);
      const scale = 1.0 + n * 0.22;
      pos.setXYZ(i, vx * scale * 1.15, vy * scale * 0.78, vz * scale * 1.05);
    }
    geo.computeVertexNormals();
    paintGeometryColors(geo, new THREE.Color(0x3a3938), new THREE.Color(0x78746d), -0.8, 0.8);
    return geo;
  }

  const pineGeos = createPineGeometries();
  const palmGeos = createPalmGeometries();
  const bushGeo  = createBushGeometry();
  const rockGeo  = createRockGeometry();

  const barkMaterial = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.92, metalness: 0.02 });
  const pineMaterial = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.78, metalness: 0.02 });
  const palmMaterial = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.68, metalness: 0.05 });
  const bushMaterial = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.80, metalness: 0.02 });
  const rockMaterial = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.88, metalness: 0.06 });

  injectWindShader(barkMaterial, 0.14, 4.6);
  injectWindShader(pineMaterial, 0.26, 5.5);
  injectWindShader(palmMaterial, 0.34, 5.0);
  injectWindShader(bushMaterial, 0.12, 1.2);

  const MAX_PINES  = 2400;
  const MAX_PALMS  = 950;
  const MAX_BUSHES = 2800;
  const MAX_ROCKS  = 1800;

  const pineTrunkInst  = new THREE.InstancedMesh(pineGeos.trunkGeo, barkMaterial, MAX_PINES);
  const pineCanopyInst = new THREE.InstancedMesh(pineGeos.canopyGeo, pineMaterial, MAX_PINES);
  const palmTrunkInst  = new THREE.InstancedMesh(palmGeos.trunkGeo, barkMaterial, MAX_PALMS);
  const palmCrownInst  = new THREE.InstancedMesh(palmGeos.crownGeo, palmMaterial, MAX_PALMS);
  const bushInst       = new THREE.InstancedMesh(bushGeo, bushMaterial, MAX_BUSHES);
  const rockInst       = new THREE.InstancedMesh(rockGeo, rockMaterial, MAX_ROCKS);

  const allInstancedMeshes = [
    pineTrunkInst, pineCanopyInst,
    palmTrunkInst, palmCrownInst,
    bushInst, rockInst
  ];

  for (const im of allInstancedMeshes) {
    im.castShadow = true;
    im.receiveShadow = true;
    scene.add(im);
  }

  function populateEcosystemInstances() {
    const dummy = new THREE.Object3D();
    const colorVar = new THREE.Color();

    let pineIdx = 0;
    let palmIdx = 0;
    let bushIdx = 0;
    let rockIdx = 0;

    let rngState = noiseGen.seed * 48271;
    const rand = () => {
      rngState = (rngState * 48271) % 2147483647;
      return (rngState - 1) / 2147483646;
    };

    // Pines
    for (let attempt = 0; attempt < 9500 && pineIdx < MAX_PINES; attempt++) {
      const r = Math.sqrt(rand()) * 195.0;
      const theta = rand() * Math.PI * 2.0;
      const x = Math.cos(theta) * r;
      const z = Math.sin(theta) * r;

      const { height, moisture } = noiseGen.sampleTerrain(x, z);
      if (height < 4.8 || height > 30.5) continue;

      const norm = noiseGen.sampleNormal(x, z);
      if (norm.y < 0.78) continue;

      if (rand() > moisture * 1.15 + 0.15) continue;

      const scale = 0.65 + rand() * 0.95;
      dummy.position.set(x, height - 0.08, z);
      dummy.rotation.set((rand() - 0.5) * 0.08, rand() * Math.PI * 2.0, (rand() - 0.5) * 0.08);
      dummy.scale.set(scale, scale * (0.9 + rand() * 0.25), scale);
      dummy.updateMatrix();

      pineTrunkInst.setMatrixAt(pineIdx, dummy.matrix);
      pineCanopyInst.setMatrixAt(pineIdx, dummy.matrix);

      colorVar.setHSL(0.28 + (rand() - 0.5) * 0.05, 0.55 + rand() * 0.2, 0.42 + rand() * 0.16);
      pineCanopyInst.setColorAt(pineIdx, colorVar);
      colorVar.setHSL(0.08, 0.35, 0.45 + rand() * 0.15);
      pineTrunkInst.setColorAt(pineIdx, colorVar);

      pineIdx++;
    }

    // Palms
    for (let attempt = 0; attempt < 6500 && palmIdx < MAX_PALMS; attempt++) {
      const r = Math.sqrt(rand()) * 210.0;
      const theta = rand() * Math.PI * 2.0;
      const x = Math.cos(theta) * r;
      const z = Math.sin(theta) * r;

      const { height, moisture } = noiseGen.sampleTerrain(x, z);
      if (height < 0.85 || height > 6.8) continue;

      const norm = noiseGen.sampleNormal(x, z);
      if (norm.y < 0.82) continue;

      if (rand() > moisture * 0.95 + 0.25) continue;

      const scale = 0.7 + rand() * 0.68;
      dummy.position.set(x, height - 0.06, z);
      const coastAngle = Math.atan2(z, x) + (rand() - 0.5) * 1.2;
      dummy.rotation.set(0, -coastAngle, 0);
      dummy.scale.set(scale, scale * (0.85 + rand() * 0.3), scale);
      dummy.updateMatrix();

      palmTrunkInst.setMatrixAt(palmIdx, dummy.matrix);
      palmCrownInst.setMatrixAt(palmIdx, dummy.matrix);

      colorVar.setHSL(0.25 + (rand() - 0.5) * 0.06, 0.62, 0.46 + rand() * 0.14);
      palmCrownInst.setColorAt(palmIdx, colorVar);
      colorVar.setHSL(0.08, 0.3, 0.48 + rand() * 0.12);
      palmTrunkInst.setColorAt(palmIdx, colorVar);

      palmIdx++;
    }

    // Bushes
    for (let attempt = 0; attempt < 9000 && bushIdx < MAX_BUSHES; attempt++) {
      const r = Math.sqrt(rand()) * 205.0;
      const theta = rand() * Math.PI * 2.0;
      const x = Math.cos(theta) * r;
      const z = Math.sin(theta) * r;

      const { height, moisture } = noiseGen.sampleTerrain(x, z);
      if (height < 1.2 || height > 26.0) continue;

      const norm = noiseGen.sampleNormal(x, z);
      if (norm.y < 0.76) continue;

      const scale = 0.55 + rand() * 1.15;
      dummy.position.set(x, height - 0.05, z);
      dummy.rotation.set(0, rand() * Math.PI * 2.0, 0);
      dummy.scale.set(scale, scale * (0.8 + rand() * 0.4), scale);
      dummy.updateMatrix();

      bushInst.setMatrixAt(bushIdx, dummy.matrix);
      colorVar.setHSL(0.27 + (rand() - 0.5) * 0.07, 0.5 + moisture * 0.25, 0.38 + rand() * 0.18);
      bushInst.setColorAt(bushIdx, colorVar);
      bushIdx++;
    }

    // Rocks
    for (let attempt = 0; attempt < 6000 && rockIdx < MAX_ROCKS; attempt++) {
      const r = Math.sqrt(rand()) * 225.0;
      const theta = rand() * Math.PI * 2.0;
      const x = Math.cos(theta) * r;
      const z = Math.sin(theta) * r;

      const { height } = noiseGen.sampleTerrain(x, z);
      if (height < -1.8 || height > 38.0) continue;

      const norm = noiseGen.sampleNormal(x, z);
      const isShore = height > -1.2 && height < 2.2;
      const isSlope = norm.y < 0.82 && norm.y > 0.52;
      if (!isShore && !isSlope && rand() > 0.22) continue;

      const baseScale = isShore ? (0.45 + rand() * 1.65) : (0.4 + rand() * 1.35);
      dummy.position.set(x, height - baseScale * 0.22, z);
      dummy.rotation.set(rand() * Math.PI, rand() * Math.PI, rand() * Math.PI);
      dummy.scale.set(
        baseScale * (0.8 + rand() * 0.6),
        baseScale * (0.6 + rand() * 0.55),
        baseScale * (0.8 + rand() * 0.6)
      );
      dummy.updateMatrix();

      rockInst.setMatrixAt(rockIdx, dummy.matrix);
      const shade = 0.42 + rand() * 0.28;
      colorVar.setRGB(shade, shade * 0.98, shade * 0.95);
      rockInst.setColorAt(rockIdx, colorVar);
      rockIdx++;
    }

    pineTrunkInst.count = pineIdx;
    pineCanopyInst.count = pineIdx;
    palmTrunkInst.count = palmIdx;
    palmCrownInst.count = palmIdx;
    bushInst.count = bushIdx;
    rockInst.count = rockIdx;

    for (const im of allInstancedMeshes) {
      im.instanceMatrix.needsUpdate = true;
      if (im.instanceColor) im.instanceColor.needsUpdate = true;
    }
  }

  // ============================================================================
  // 7. ATMOSPHERE
  // ============================================================================
  let sunElevationDeg = 34.0;
  let sunAzimuthDeg   = 145.0;

  function updateAtmosphereAndSun(elevationDeg, azimuthDeg) {
    sunElevationDeg = elevationDeg;
    sunAzimuthDeg = azimuthDeg;

    const phi = THREE.MathUtils.degToRad(90.0 - elevationDeg);
    const theta = THREE.MathUtils.degToRad(azimuthDeg);

    const sunDir = new THREE.Vector3().setFromSphericalCoords(1.0, phi, theta).normalize();
    globalUniforms.uSunDirection.value.copy(sunDir);

    sunLight.position.copy(sunDir).multiplyScalar(320.0);

    const t = Math.min(1.0, Math.max(0.0, (elevationDeg - 3.0) / 62.0));
    const smoothT = t * t * (3.0 - 2.0 * t);

    const cZenithSunset  = new THREE.Color(0x162242);
    const cZenithGolden  = new THREE.Color(0x1b4e8c);
    const cZenithNoon    = new THREE.Color(0x1958a8);

    const cHorizonSunset = new THREE.Color(0xe87a5d);
    const cHorizonGolden = new THREE.Color(0xd9c2a3);
    const cHorizonNoon   = new THREE.Color(0x9bd2eb);

    const cSunSunset     = new THREE.Color(0xff6b3d);
    const cSunGolden     = new THREE.Color(0xffdfa8);
    const cSunNoon       = new THREE.Color(0xfff9eb);

    if (smoothT < 0.45) {
      const subT = smoothT / 0.45;
      globalUniforms.uSkyZenithColor.value.copy(cZenithSunset).lerp(cZenithGolden, subT);
      globalUniforms.uSkyHorizonColor.value.copy(cHorizonSunset).lerp(cHorizonGolden, subT);
      globalUniforms.uSunColor.value.copy(cSunSunset).lerp(cSunGolden, subT);
    } else {
      const subT = (smoothT - 0.45) / 0.55;
      globalUniforms.uSkyZenithColor.value.copy(cZenithGolden).lerp(cZenithNoon, subT);
      globalUniforms.uSkyHorizonColor.value.copy(cHorizonGolden).lerp(cHorizonNoon, subT);
      globalUniforms.uSunColor.value.copy(cSunGolden).lerp(cSunNoon, subT);
    }

    fogColor.copy(globalUniforms.uSkyHorizonColor.value);
    sunLight.color.copy(globalUniforms.uSunColor.value);
    sunLight.intensity = 1.8 + smoothT * 1.9;

    hemiLight.color.copy(globalUniforms.uSkyHorizonColor.value).lerp(globalUniforms.uSkyZenithColor.value, 0.4);
    hemiLight.groundColor.setHex(0x3a4734).lerp(globalUniforms.uSunColor.value, 0.18);
    hemiLight.intensity = 0.75 + smoothT * 0.55;
  }

  // ============================================================================
  // 8. CAMERA PRESETS & UI
  // ============================================================================
  const cameraPresets = {
    overview: { pos: new THREE.Vector3(175, 78, 205), target: new THREE.Vector3(0, 12, 0) },
    lagoon:   { pos: new THREE.Vector3(92, 16, 108),  target: new THREE.Vector3(18, 4, 24) },
    peak:     { pos: new THREE.Vector3(-68, 62, -55), target: new THREE.Vector3(5, 26, 8) },
    shore:    { pos: new THREE.Vector3(-115, 9, 85),  target: new THREE.Vector3(-35, 6, 15) }
  };

  let activeCameraFlight = null;

  function flyToCameraPreset(key) {
    const preset = cameraPresets[key];
    if (!preset) return;
    activeCameraFlight = {
      startPos: camera.position.clone(),
      endPos: preset.pos.clone(),
      startTarget: controls.target.clone(),
      endTarget: preset.target.clone(),
      progress: 0.0
    };
  }

  controls.addEventListener('start', () => {
    activeCameraFlight = null;
  });

  // --- Sliders ---
  const sliderSunElev = document.getElementById('slider-sun-elevation');
  const sliderSunAzim = document.getElementById('slider-sun-azimuth');
  const sliderWaves   = document.getElementById('slider-waves');
  const sliderWind    = document.getElementById('slider-wind');
  const sliderClouds  = document.getElementById('slider-clouds');

  sliderSunElev.addEventListener('input', (e) => {
    const val = parseFloat(e.target.value);
    document.getElementById('val-sun-elevation').textContent = `${Math.round(val)}°`;
    updateAtmosphereAndSun(val, sunAzimuthDeg);
  });

  sliderSunAzim.addEventListener('input', (e) => {
    const val = parseFloat(e.target.value);
    document.getElementById('val-sun-azimuth').textContent = `${Math.round(val)}°`;
    updateAtmosphereAndSun(sunElevationDeg, val);
  });

  sliderWaves.addEventListener('input', (e) => {
    const val = parseFloat(e.target.value);
    globalUniforms.uWaveIntensity.value = val;
    document.getElementById('val-waves').textContent = `${val.toFixed(2)}×`;
  });

  sliderWind.addEventListener('input', (e) => {
    const val = parseFloat(e.target.value);
    globalUniforms.uWindSpeed.value = val;
    document.getElementById('val-wind').textContent = `${val.toFixed(2)}×`;
  });

  sliderClouds.addEventListener('input', (e) => {
    const val = parseFloat(e.target.value);
    globalUniforms.uCloudCoverage.value = val;
    document.getElementById('val-clouds').textContent = `${Math.round(val * 100)}%`;
  });

  // --- Lighting presets ---
  const timePresets = {
    noon:   { elev: 66,  azim: 130, clouds: 0.38 },
    golden: { elev: 34,  azim: 145, clouds: 0.52 },
    sunset: { elev: 7.5, azim: 215, clouds: 0.66 }
  };

  document.querySelectorAll('.time-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const p = timePresets[btn.dataset.time];
      if (!p) return;

      sliderSunElev.value = p.elev;
      sliderSunAzim.value = p.azim;
      sliderClouds.value  = p.clouds;

      document.getElementById('val-sun-elevation').textContent = `${Math.round(p.elev)}°`;
      document.getElementById('val-sun-azimuth').textContent = `${Math.round(p.azim)}°`;
      document.getElementById('val-clouds').textContent = `${Math.round(p.clouds * 100)}%`;

      globalUniforms.uCloudCoverage.value = p.clouds;
      updateAtmosphereAndSun(p.elev, p.azim);
    });
  });

  // --- Camera presets ---
  document.querySelectorAll('.cam-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.cam-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      flyToCameraPreset(btn.dataset.cam);
    });
  });

  // --- Panel toggle ---
  const panel = document.getElementById('panel');
  const panelOpen = document.getElementById('panel-open');
  const panelClose = document.getElementById('panel-close');

  function setPanelVisible(visible) {
    panel.style.display = visible ? '' : 'none';
    panelOpen.style.display = visible ? 'none' : 'block';
  }

  panelClose.addEventListener('click', () => setPanelVisible(false));
  panelOpen.addEventListener('click', () => setPanelVisible(true));

  // --- Loader ---
  const loaderEl = document.getElementById('loader');
  let loaderHideTimer = null;

  function showLoader() {
    if (loaderHideTimer) { clearTimeout(loaderHideTimer); loaderHideTimer = null; }
    loaderEl.style.display = 'flex';
    // force reflow so the transition replays on every show
    void loaderEl.offsetWidth;
    loaderEl.classList.remove('hidden');
  }

  function hideLoader() {
    loaderEl.classList.add('hidden');
    loaderHideTimer = setTimeout(() => {
      loaderEl.style.display = 'none';
      loaderHideTimer = null;
    }, 800);
  }

  // --- Regenerate ---
  document.getElementById('regenerate-btn').addEventListener('click', () => {
    showLoader();
    // let the browser paint the loader before the heavy synchronous rebuild
    setTimeout(() => {
      const newSeed = Math.floor(1000 + Math.random() * 8999);
      noiseGen.setSeed(newSeed);
      generateHeightmapDataTexture();
      buildTerrainGeometry();
      populateEcosystemInstances();
      hideLoader();
    }, 60);
  });

  // --- Resize ---
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ============================================================================
  // 9. INIT & RENDER LOOP
  // ============================================================================
  function initScene() {
    generateHeightmapDataTexture();
    buildTerrainGeometry();
    populateEcosystemInstances();
    updateAtmosphereAndSun(sunElevationDeg, sunAzimuthDeg);
  }

  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);

    const delta = Math.min(clock.getDelta(), 0.1);
    const elapsed = clock.getElapsedTime();
    globalUniforms.uTime.value = elapsed;

    if (activeCameraFlight) {
      activeCameraFlight.progress += delta * 0.85;
      const t = Math.min(1.0, activeCameraFlight.progress);
      const ease = t < 0.5 ? 4.0 * t * t * t : 1.0 - Math.pow(-2.0 * t + 2.0, 3.0) / 2.0;

      camera.position.lerpVectors(activeCameraFlight.startPos, activeCameraFlight.endPos, ease);
      controls.target.lerpVectors(activeCameraFlight.startTarget, activeCameraFlight.endTarget, ease);
      if (t >= 1.0) activeCameraFlight = null;
    }

    controls.update();

    if (camera.position.y < 1.8) {
      camera.position.y = 1.8;
    }

    renderer.render(scene, camera);
  }

  // Let the loader paint at least one frame before the heavy generation work.
  requestAnimationFrame(() => {
    setTimeout(() => {
      initScene();
      animate();
      hideLoader();
    }, 60);
  });
</script>

</body>
</html>
